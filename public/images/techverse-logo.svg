<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ti-grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="ti-grad-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="ti-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Gradient -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#ti-grad-ring)" stroke-width="26" />
  <circle cx="250" cy="250" r="202" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
  
  <!-- Inner circular badge -->
  <circle cx="250" cy="250" r="198" fill="#0d0e15" />

  <!-- TI Monogram Geometry -->
  <g transform="translate(140, 145) scale(0.95)" fill="url(#ti-grad-mono)">
    <!-- Top Bar with 45 degree cuts -->
    <path d="M 0,0 L 240,0 L 210,32 L 30,32 Z" />
    
    <!-- Left 'T' Stem -->
    <path d="M 45,42 L 105,42 L 105,210 L 45,170 Z" />
    
    <!-- Right 'I' Stem -->
    <path d="M 135,42 L 195,42 L 195,210 L 135,250 Z" />
  </g>

  <!-- Circular curved text "TECHVERSE INFOTECH" -->
  <path id="text-path" d="M 80,330 A 180,180 0 0,0 420,330" fill="none" stroke="none" />
  <text font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="8">
    <textPath href="#text-path" startOffset="50%" text-anchor="middle">
      TECHVERSE INFOTECH
    </textPath>
  </text>
</svg>
